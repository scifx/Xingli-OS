name: verify

on:
  push:
  pull_request:

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装测试依赖（运行时零依赖）
        run: python -m pip install --upgrade pip pytest
      - name: 自动化测试
        run: python -m pytest -q
      - name: 理论模型离线验证
        run: python demo.py
